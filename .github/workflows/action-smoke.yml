name: reusable-action-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supported-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run repository action
        uses: ./
        with:
          input: examples/supported.json
          json-output: agent-evidence-verdict.json
      - name: Verify ALLOW verdict artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          verdict = json.loads(Path("agent-evidence-verdict.json").read_text(encoding="utf-8"))
          assert verdict["decision"] == "ALLOW", verdict
          PY
