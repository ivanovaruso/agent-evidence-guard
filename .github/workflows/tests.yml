name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  package:
    name: Build and smoke-test distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Smoke-test installed CLI
        run: agent-evidence-guard examples/supported.json
      - name: Smoke-test installed GitHub adapter
        run: agent-evidence-guard-github examples/supported.json --json-output /tmp/guard-verdict.json
