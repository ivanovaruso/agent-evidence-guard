name: verify-pypi-v0.1.1

on:
  pull_request:
    paths:
      - ".github/workflows/verify-pypi-v0.1.1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install released package from PyPI
        run: python -m pip install --no-cache-dir agent-evidence-guard==0.1.1

      - name: Verify installed package version
        run: |
          python - <<'PY'
          import agent_evidence_guard
          assert agent_evidence_guard.__version__ == "0.1.1", agent_evidence_guard.__version__
          print("installed version:", agent_evidence_guard.__version__)
          PY

      - name: Smoke-test released CLI
        run: agent-evidence-guard --help

      - name: Smoke-test released GitHub adapter
        run: agent-evidence-guard-github --help
