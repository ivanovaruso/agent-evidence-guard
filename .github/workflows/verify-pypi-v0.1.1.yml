name: verify-pypi-v0.1.1

on:
  pull_request:
    paths:
      - ".github/workflows/verify-pypi-v0.1.1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install released package from PyPI
        run: python -m pip install --no-cache-dir agent-evidence-guard==0.1.1

      - name: Verify installed package version
        run: |
          python - <<'PY'
          import agent_evidence_guard
          assert agent_evidence_guard.__version__ == "0.1.1", agent_evidence_guard.__version__
          print("installed version:", agent_evidence_guard.__version__)
          PY

      - name: Create valid evidence contract
        run: |
          cat > evidence.json <<'JSON'
          {
            "claim": "post-release smoke test complete",
            "authority_ref": "PR-15",
            "required_evidence": ["tests"],
            "evidence": {"tests": "PyPI clean-install smoke test"},
            "prohibited_claims": ["production deployed"]
          }
          JSON

      - name: Smoke-test released CLI
        run: agent-evidence-guard evidence.json

      - name: Smoke-test released GitHub adapter
        run: agent-evidence-guard-github evidence.json --json-output guard-verdict.json

      - name: Verify adapter verdict
        run: |
          python - <<'PY'
          import json
          verdict = json.load(open("guard-verdict.json", encoding="utf-8"))
          assert verdict["decision"] == "ALLOW", verdict
          print("adapter decision:", verdict["decision"])
          PY
