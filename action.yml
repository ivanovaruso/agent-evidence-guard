name: Agent Evidence Guard
description: Validate an AI-agent completion claim against declared evidence requirements.
author: ivanovaruso

branding:
  icon: shield
  color: gray-dark

inputs:
  input:
    description: Path to the evidence-contract JSON file in the caller workspace.
    required: true
  json-output:
    description: Optional path for the machine-readable verdict JSON.
    required: false
    default: agent-evidence-verdict.json

runs:
  using: composite
  steps:
    - name: Run Agent Evidence Guard
      shell: bash
      env:
        AEG_ACTION_PATH: ${{ github.action_path }}
        AEG_INPUT_PATH: ${{ inputs.input }}
        AEG_JSON_OUTPUT_PATH: ${{ inputs.json-output }}
      run: |
        python -I -c 'import sys; sys.path.insert(0, sys.argv.pop(1)); from agent_evidence_guard.github_ci import main; main()' \
          "$AEG_ACTION_PATH" "--json-output=$AEG_JSON_OUTPUT_PATH" -- "$AEG_INPUT_PATH"
